<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://theshotcaller.online/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Shotcaller" />
    <meta property="og:title" content="The Shotcaller — Free browser strategy game" />
    <meta
      property="og:description"
      content="Play The Shotcaller, a free browser strategy game. Draft heroes, build synergies, command three lanes and challenge friends to a duel."
    />
    <meta property="og:url" content="https://theshotcaller.online/" />
    <meta property="og:image" content="https://theshotcaller.online/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Shotcaller — Free browser strategy game</title>
    <meta
      name="description"
      content="Play The Shotcaller, a free browser strategy game. Draft heroes, build synergies, command three lanes and challenge friends to a duel."
    />
    <meta name="theme-color" content="#131b18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- An opaque system bar avoids the blurred edge of translucent Home Screen apps on iPadOS 27. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="The Shotcaller" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!--
      The text in #app is for crawlers and link previews. With JavaScript on, players see only the board colour
      until the game mounts and Vue marks the container with data-v-app, so that text never flashes first.
    -->
    <style>
      html {
        background: #131b18;
      }

      .js #app:not([data-v-app]) {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
