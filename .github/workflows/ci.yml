name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; move on purpose once CI passes there.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Typecheck already ran above, so only the Vite bundle is built here.
      - name: Build
        run: npx vite build

      - name: Desktop build
        run: npm run desktop:build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
