name: Release installer

on:
  push:
    branches: [main]
    paths:
      - src/ui/patchNotes/notes.ts
      - discord-companion/**
      - .github/workflows/release-windows.yml

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: discord-companion/package-lock.json

      - name: Install companion
        working-directory: discord-companion
        run: npm ci

      - name: Build installer
        working-directory: discord-companion
        run: npm run build:windows

      - name: Publish to GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $notes = Get-Content -Raw src/ui/patchNotes/notes.ts
          if ($notes -notmatch "version:\s*'([^']+)'") { throw 'No patch version in notes.ts' }
          $version = $Matches[1]
          $tag = "v$version"
          $notesUrl = "https://theshotcaller.online/patches/$version/"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Patch $version" --notes $notesUrl
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release' }
          }
          gh release upload $tag "discord-companion/dist/The Shotcaller Installer.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer' }
